# Place inside the nginx http context (e.g. sites-available/ramda).
proxy_cache_path /var/cache/nginx/ramda levels=1:2 keys_zone=ramda:8m max_size=50m inactive=10m use_temp_path=off;
map $request_method $ramda_non_get { default 1; GET 0; HEAD 0; }
map $args $ramda_has_query { default 1; '' 0; }
log_format ramda_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name ramda.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ramda.example.com;
    ssl_certificate /etc/letsencrypt/live/ramda.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ramda.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ramda.access.log ramda_safe;
    error_log /var/log/nginx/ramda.error.log warn;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
    # Install a compatible Brotli module before installing this optional snippet.
    include /etc/nginx/snippets/ramda-brotli*.conf;
    location = /__revalidate { deny all; }
    location = /api/public/ai/chat {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 75s;
    }
    location = /admin/backup/uploads-import {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(api|admin|static)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location /uploads/ {
        alias /srv/ramda/var/uploads/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /_astro/ {
        alias /srv/ramda/frontend/dist/client/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /brand/ {
        alias /srv/ramda/frontend/dist/client/brand/;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache ramda;
        proxy_cache_key "$scheme$request_method$host$uri";
        proxy_cache_valid 200 1s;
        proxy_no_cache $ramda_non_get $ramda_has_query $http_authorization $http_cookie;
        proxy_cache_bypass $ramda_non_get $ramda_has_query $http_authorization $http_cookie;
        proxy_cache_lock on;
    }
}
