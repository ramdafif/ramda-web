name: RAMDA quality gates
on:
  push:
    branches: ['web-pribadi/NEW']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ramda-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          npm --prefix frontend ci
      - name: Python lint and unit/integration tests
        env:
          SECRET_KEY: ci-only-key-at-least-thirty-two-characters
        run: |
          backend/.venv/bin/ruff check backend/ramda backend/tests
          backend/.venv/bin/python -m pytest backend/tests -q
      - name: Frontend lint, types, CMS copy boundary and production build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run check
          node tests/content-boundary.mjs
          npm --prefix frontend run build
      - name: Dependency security audit
        run: |
          backend/.venv/bin/pip-audit -r backend/requirements.lock --progress-spinner off
          npm --prefix frontend audit --audit-level=moderate
      - name: HTTP smoke through the compiled SSR app
        run: node tests/run-http-smoke.mjs
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright desktop/mobile and axe
        working-directory: frontend
        run: npm test
      - name: Lighthouse mobile thresholds
        working-directory: frontend
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ramda-qa-reports
          path: |
            frontend/playwright-report
            frontend/test-results
            lighthouse-report
          retention-days: 7
  mysql-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ramda_test
          MYSQL_USER: ramda_test
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-only-key-at-least-thirty-two-characters
      DATABASE_URL: mysql+pymysql://ramda_test:ci-database-password@127.0.0.1:3306/ramda_test?charset=utf8mb4
      DEV_ALLOW_UNVERIFIED_FORMS: 'true'
      SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m flask --app backend/wsgi.py db upgrade
          backend/.venv/bin/python -m flask --app backend/wsgi.py seed
          backend/.venv/bin/python tests/mysql-smoke.py
